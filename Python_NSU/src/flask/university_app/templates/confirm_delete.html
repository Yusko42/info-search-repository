{% extends 'base.html' %}

{% block content %}

<h1>Подтверждение удаления</h1>

<p>
    Вы действительно хотите удалить запись:
    {{ object }}?
</p>

<form method="post">
    <input type="hidden"
           name="csrf_token"
           value="{{ csrf_token() }}">

    <button type="submit">Удалить</button>
</form>

<a href="javascript:history.back()">Отмена</a>

{% endblock %}
